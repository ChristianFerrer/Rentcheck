name: Update rental district data

on:
  # Run on the 1st of January, April, July, October at 08:00 UTC
  # (one week after Generalitat typically publishes new quarterly data)
  schedule:
    - cron: "0 8 1 1,4,7,10 *"
  # Allow manual trigger from the Actions UI
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run update script
        env:
          GENERALITAT_APP_TOKEN: ${{ secrets.GENERALITAT_APP_TOKEN }}
        run: node scripts/update-district-data.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/data/barcelona-districts.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/barcelona-districts.json
          QUARTER=$(node -e "
            const d = JSON.parse(require('fs').readFileSync('src/data/barcelona-districts.json','utf8'));
            console.log(d._meta.lastUpdated);
          ")
          git commit -m "chore: update Barcelona district rental data ($QUARTER)"
          git push
